<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <script src="https://unpkg.com/streamlit-component-lib@2.0.0/dist/index.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;

            background: transparent;

            font-family:
                Arial,
                sans-serif;

        }


        .scanner {

            width: 100%;

            max-width: 900px;

            margin: auto;

        }


        /* ==========================================
           HEADER
           ========================================== */

        .header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 10px 4px 14px;

        }


        .back {

            border: none;

            background: transparent;

            font-size: 24px;

            cursor: pointer;

            padding: 4px 8px;

        }


        .title {

            font-size: 19px;

            font-weight: 700;

        }


        .counter {

            font-size: 14px;

            font-weight: 600;

            color: #666;

        }


        /* ==========================================
           CAMERA AREA
           ========================================== */

        .camera-area {

            position: relative;

            width: 100%;

            height: 68vh;

            min-height: 480px;

            overflow: hidden;

            border-radius: 16px;

            background: #111;

        }


        video {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: none;

        }


        /* ==========================================
           DOCUMENT GUIDE
           ========================================== */

        .guide {

            position: absolute;

            inset: 8% 7%;

            border: 2px solid rgba(
                255,
                255,
                255,
                0.85
            );

            border-radius: 4px;

            pointer-events: none;

            display: none;

        }


        .guide::before,
        .guide::after {

            content: "";

            position: absolute;

            width: 30px;

            height: 30px;

        }


        .guide::before {

            top: -2px;
            left: -2px;

            border-top: 4px solid white;
            border-left: 4px solid white;

        }


        .guide::after {

            bottom: -2px;
            right: -2px;

            border-bottom: 4px solid white;
            border-right: 4px solid white;

        }


        /* ==========================================
           START SCREEN
           ========================================== */

        .start-screen {

            width: 100%;

            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            color: white;

            gap: 15px;

        }


        .camera-icon {

            font-size: 60px;

        }


        .start-title {

            font-size: 20px;

            font-weight: 700;

        }


        .start-description {

            font-size: 14px;

            opacity: 0.75;

            text-align: center;

            padding: 0 25px;

        }


        .start-button {

            margin-top: 10px;

            padding: 14px 35px;

            border: none;

            border-radius: 50px;

            background: white;

            color: #222;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

        }


        /* ==========================================
           BOTTOM CONTROL
           ========================================== */

        .controls {

            display: none;

            align-items: center;

            justify-content: center;

            padding: 15px 5px;

        }


        .capture-button {

            width: 76px;

            height: 76px;

            border-radius: 50%;

            border: 6px solid #ddd;

            background: white;

            cursor: pointer;

            font-size: 28px;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        /* ==========================================
           PREVIEW
           ========================================== */

        .preview-wrapper {

            display: none;

            padding: 5px 0 10px;

        }


        .preview-title {

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;

        }


        .preview-list {

            display: flex;

            gap: 8px;

            overflow-x: auto;

            padding-bottom: 5px;

        }


        .preview-item {

            position: relative;

            flex: 0 0 70px;

            height: 88px;

            border-radius: 8px;

            overflow: hidden;

            border: 2px solid #ddd;

            background: #eee;

        }


        .preview-item img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .delete {

            position: absolute;

            top: 2px;

            right: 2px;

            width: 22px;

            height: 22px;

            padding: 0;

            border: none;

            border-radius: 50%;

            background: rgba(
                0,
                0,
                0,
                0.7
            );

            color: white;

            cursor: pointer;

            font-size: 12px;

        }


        .page-number {

            position: absolute;

            bottom: 0;

            left: 0;

            right: 0;

            background: rgba(
                0,
                0,
                0,
                0.6
            );

            color: white;

            font-size: 11px;

            padding: 3px;

        }


        /* ==========================================
           ACTION BUTTONS
           ========================================== */

        .actions {

            display: none;

            gap: 10px;

            margin-top: 8px;

        }


        .cancel-button,
        .ok-button {

            flex: 1;

            padding: 14px;

            border: none;

            border-radius: 12px;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

        }


        .cancel-button {

            background: #eee;

            color: #333;

        }


        .ok-button {

            background: #111;

            color: white;

        }


        .status {

            text-align: center;

            font-size: 13px;

            color: #777;

            padding: 5px 0;

        }

    </style>

</head>


<body>


<div class="scanner">


    <!-- ==========================================
         HEADER
         ========================================== -->

    <div class="header">

        <button
            class="back"
            onclick="cancelScan()"
        >
            ←
        </button>


        <div class="title">
            Scan Dokumen
        </div>


        <div
            id="counter"
            class="counter"
        >
            0 / 5
        </div>

    </div>


    <!-- ==========================================
         CAMERA
         ========================================== -->

    <div class="camera-area">


        <div
            id="startScreen"
            class="start-screen"
        >

            <div class="camera-icon">
                📷
            </div>


            <div class="start-title">
                Siap Memindai
            </div>


            <div class="start-description">
                Arahkan kamera ke dokumen.
                Kamera belakang akan digunakan
                secara otomatis.
            </div>


            <button
                class="start-button"
                onclick="startCamera()"
            >
                START
            </button>

        </div>


        <video
            id="video"
            autoplay
            playsinline
            muted
        ></video>


        <div
            id="guide"
            class="guide"
        ></div>

    </div>


    <!-- ==========================================
         CAPTURE
         ========================================== -->

    <div
        id="controls"
        class="controls"
    >

        <button
            class="capture-button"
            onclick="capturePhoto()"
        >
            📸
        </button>

    </div>


    <!-- ==========================================
         PREVIEW
         ========================================== -->

    <div
        id="previewWrapper"
        class="preview-wrapper"
    >

        <div class="preview-title">
            Halaman yang dipindai
        </div>


        <div
            id="previewList"
            class="preview-list"
        ></div>

    </div>


    <!-- ==========================================
         ACTIONS
         ========================================== -->

    <div
        id="actions"
        class="actions"
    >

        <button
            class="cancel-button"
            onclick="cancelScan()"
        >
            Batal
        </button>


        <button
            class="ok-button"
            onclick="finishScan()"
        >
            ✓ OK
        </button>

    </div>


    <div
        id="status"
        class="status"
    >
        Maksimal 5 halaman
    </div>


</div>


<script>


let video =
    document.getElementById(
        "video"
    );


let startScreen =
    document.getElementById(
        "startScreen"
    );


let controls =
    document.getElementById(
        "controls"
    );


let guide =
    document.getElementById(
        "guide"
    );


let previewWrapper =
    document.getElementById(
        "previewWrapper"
    );


let previewList =
    document.getElementById(
        "previewList"
    );


let actions =
    document.getElementById(
        "actions"
    );


let counter =
    document.getElementById(
        "counter"
    );


let statusText =
    document.getElementById(
        "status"
    );


let stream = null;


let photos = [];



/* ==========================================
   START CAMERA
   ========================================== */

async function startCamera() {

    try {

        statusText.innerText =
            "Meminta izin kamera...";


        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }

                },

                audio: false

            });


        video.srcObject =
            stream;


        startScreen.style.display =
            "none";


        video.style.display =
            "block";


        guide.style.display =
            "block";


        controls.style.display =
            "flex";


        statusText.innerText =
            "Posisikan dokumen di dalam kotak";


        updateHeight();

    }

    catch (error) {

        console.error(error);


        statusText.innerText =
            "❌ Kamera tidak dapat digunakan. " +
            "Pastikan izin kamera diberikan.";

    }

}



/* ==========================================
   CAPTURE PHOTO
   ========================================== */

function capturePhoto() {


    if (!stream) {
        return;
    }


    if (photos.length >= 5) {

        statusText.innerText =
            "Maksimal 5 halaman.";

        return;

    }


    if (
        video.videoWidth === 0 ||
        video.videoHeight === 0
    ) {

        statusText.innerText =
            "Kamera belum siap.";

        return;

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(

        video,

        0,

        0,

        canvas.width,

        canvas.height

    );


    const imageData =
        canvas.toDataURL(
            "image/jpeg",
            0.95
        );


    photos.push(
        imageData
    );


    updatePreview();

}



/* ==========================================
   UPDATE PREVIEW
   ========================================== */

function updatePreview() {


    counter.innerText =
        photos.length + " / 5";


    previewList.innerHTML =
        "";


    photos.forEach(
        function(photo, index) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "preview-item";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                photo;


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.className =
                "delete";


            deleteButton.innerText =
                "×";


            deleteButton.onclick =
                function() {

                    deletePhoto(index);

                };


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "page-number";


            number.innerText =
                "Halaman " +
                (index + 1);


            item.appendChild(
                img
            );


            item.appendChild(
                deleteButton
            );


            item.appendChild(
                number
            );


            previewList.appendChild(
                item
            );

        }
    );


    if (photos.length > 0) {

        previewWrapper.style.display =
            "block";

        actions.style.display =
            "flex";

    }

    else {

        previewWrapper.style.display =
            "none";

        actions.style.display =
            "none";

    }


    if (photos.length >= 5) {

        statusText.innerText =
            "Maksimal 5 halaman telah tercapai.";

    }

    else {

        statusText.innerText =
            "Ambil halaman berikutnya atau tekan OK.";

    }


    updateHeight();

}



/* ==========================================
   DELETE PHOTO
   ========================================== */

function deletePhoto(index) {

    photos.splice(
        index,
        1
    );

    updatePreview();

}



/* ==========================================
   FINISH SCAN
   ========================================== */

function finishScan() {


    if (photos.length === 0) {

        statusText.innerText =
            "Ambil minimal 1 halaman.";

        return;

    }


    /*
     * Hentikan kamera
     */

    stopCamera();


    /*
     * Kirim semua foto
     * ke Python
     */

    Streamlit.setComponentValue({

        action: "done",

        photos: photos

    });

}



/* ==========================================
   CANCEL
   ========================================== */

function cancelScan() {

    stopCamera();


    Streamlit.setComponentValue({

        action: "cancel"

    });

}



/* ==========================================
   STOP CAMERA
   ========================================== */

function stopCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );

        stream = null;

    }

}



/* ==========================================
   STREAMLIT
   ========================================== */

function updateHeight() {

    setTimeout(
        function() {

            Streamlit.setFrameHeight(
                document.body.scrollHeight
            );

        },
        50
    );

}


Streamlit.setComponentReady();

updateHeight();


window.addEventListener(
    "resize",
    updateHeight
);


</script>


</body>

</html>
